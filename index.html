<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
/>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="background">
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
</div>

<main class="shell">

<section class="calculator">

<header class="header">

<div class="logo">

<div class="logo-icon">
<i class="fa-solid fa-calculator"></i>
</div>

<div>
<h2>Modern Calculator</h2>
<p>Beautiful • Fast • Responsive</p>
</div>

</div>

<div class="header-actions">

<button class="icon-btn">
<i class="fa-solid fa-clock-rotate-left"></i>
</button>

<button class="icon-btn">
<i class="fa-solid fa-moon"></i>
</button>

</div>

</header>

<div class="status-row">

<span id="status">
<i class="fa-solid fa-circle"></i>
Ready
</span>

<span id="datetime">
Today
</span>

</div>

<section class="display">

<div
class="expression"
id="expression"
>
&nbsp;
</div>

<output
class="value"
id="display"
>
0
</output>

</section>

<section class="keypad">

<button class="key utility" data-action="clear">
AC
</button>

<button class="key utility" data-action="backspace">
<i class="fa-solid fa-delete-left"></i>
</button>

<button class="key utility" data-action="sign">
±
</button>

<button class="key operator" data-operator="divide">
÷
</button>

<button class="key" data-digit="7">7</button>
<button class="key" data-digit="8">8</button>
<button class="key" data-digit="9">9</button>

<button class="key operator" data-operator="multiply">
×
</button>

<button class="key" data-digit="4">4</button>
<button class="key" data-digit="5">5</button>
<button class="key" data-digit="6">6</button>

<button class="key operator" data-operator="subtract">
−
</button>

<button class="key" data-digit="1">1</button>
<button class="key" data-digit="2">2</button>
<button class="key" data-digit="3">3</button>

<button class="key operator" data-operator="add">
+
</button>

<button class="key wide" data-digit="0">
0
</button>

<button class="key" data-action="decimal">
.
</button>

<button class="key equals" data-action="equals">
=
</button>

</section>

<footer>

<div class="footer-item">
<i class="fa-solid fa-keyboard"></i>
Keyboard Support
</div>

<div class="footer-item">
<i class="fa-solid fa-bolt"></i>
Instant Calculation
</div>

</footer>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
